[tox]
env_list =
    coverage-erase
    py{3.10, 3.11, 3.12, 3.13, 3.14}-{unidecode, text_unidecode, anyascii}
    pypy{3.11}-{unidecode, text_unidecode, anyascii}
    coverage-report
    mypy
    pycodestyle
    flake8
    packaging

[testenv]
package = wheel
depends = coverage-erase
deps =
    coverage[toml]>=7
    pytest>=8
    unidecode: pip
    unidecode: Unidecode>=1.1.1
    anyascii: anyascii>=0.3.2
commands_pre =
    # Isolate auto's Unidecode path from the mandatory fallback dependency.
    unidecode: pip uninstall --yes text-unidecode
commands = coverage run -m pytest {posargs:test.py test_release.py}

[testenv:coverage-erase]
depends =
skip_install = true
deps = coverage[toml]>=7
commands = coverage erase

[testenv:coverage-report]
skip_install = true
depends =
    py{3.10, 3.11, 3.12, 3.13, 3.14}-{unidecode, text_unidecode, anyascii}
    pypy{3.11}-{unidecode, text_unidecode, anyascii}
deps = coverage[toml]>=7
commands =
    coverage combine
    coverage report

[testenv:mypy]
depends =
deps = mypy>=1.11
commands = mypy

[testenv:pycodestyle]
depends =
deps = pycodestyle>=2.12
commands = pycodestyle --ignore=E128,E261,E225,E501,W605 --exclude=legacy_reference.py slugify test.py test_release.py setup.py tools

[testenv:coverage-html]
depends = coverage-report
skip_install = true
deps = coverage[toml]>=7
commands = coverage html --fail-under=0

[testenv:flake8]
depends =
deps = flake8>=7
commands = flake8 --ignore=E501,F403,F401,E241,E225,E128 --exclude=legacy_reference.py slugify setup.py test.py test_release.py tools

[testenv:packaging]
depends =
skip_install = true
deps =
    build>=1.2
    twine>=6
commands = python tools/check_dist.py
